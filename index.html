<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will You Be Mine?</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      overflow: hidden; 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Hey You 💫</h1>
      <p>"Every time I see you, my day feels brighter.  
      You’ve been on my mind a lot lately…  
      So, I have just one question…"</p>

      <p class="question">Will you be mine? 💖</p>

      <div class="btn-group">
        <button class="btn yes" id="yesBtn">Yes 💘</button>
        <button class="btn no" id="noBtn">No 😅</button>
      </div>
    </div>
  </div>

  <script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const card = document.querySelector(".card");

  // ✅ 'Yes' 
  yesBtn.addEventListener("click", () => {
    window.location.href = "send-number.html";
  });

  // ✅ 'No' 
  function moveButton() {
    const cardRect = card.getBoundingClientRect();
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const padding = 10; //distance

    const x =
      Math.random() * (cardRect.width - btnWidth - padding * 2) + padding;
    const y =
      Math.random() * (cardRect.height - btnHeight - padding * 2) + padding;

    noBtn.style.position = "absolute";
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
    noBtn.style.transition = "0.2s";
  }

  // hover diplays
  noBtn.addEventListener("mouseover", moveButton);

  // mobile toch diplays
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveButton();
  });

  // 🖱️ Mouse 
  document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
      e.clientX - (rect.left + rect.width / 2),
      e.clientY - (rect.top + rect.height / 2)
    );
    if (distance < 60) moveButton();
  });
</script>


</body>
</html>
